<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Magallanes Casket Production &amp; Inventory</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e8eaed; --muted:#9aa3b2; --accent:#c9a24a; --accent2:#8f7430;
    --danger:#e2574c; --ok:#4caf7d; --warn:#e2a23b;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  header{
    background:linear-gradient(135deg,#1a1d24,#14161b);
    border-bottom:1px solid var(--border);
    padding:18px 24px; display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px;
  }
  header h1{font-size:1.25rem; margin:0; letter-spacing:.3px;}
  header h1 span{color:var(--accent);}
  #connStatus{font-size:.78rem; color:var(--muted);}
  #connStatus.ok{color:var(--ok);}
  #connStatus.bad{color:var(--danger);}
  nav{
    display:flex; gap:6px; padding:10px 24px; background:var(--panel);
    border-bottom:1px solid var(--border); flex-wrap:wrap; position:sticky; top:0; z-index:10;
  }
  nav button{
    background:transparent; border:1px solid transparent; color:var(--muted);
    padding:8px 14px; border-radius:var(--radius); cursor:pointer; font-size:.88rem;
    transition:.15s;
  }
  nav button:hover{color:var(--text); background:var(--panel2);}
  nav button.active{color:#111; background:var(--accent); font-weight:600;}
  main{padding:22px 24px 60px; max-width:1200px; margin:0 auto;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:18px;
  }
  .card h2{margin:0 0 14px; font-size:1.05rem; display:flex; align-items:center; gap:8px;}
  .grid{display:grid; gap:14px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:900px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}
  .stat{
    background:var(--panel2); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px;
  }
  .stat .label{color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.5px;}
  .stat .value{font-size:1.6rem; font-weight:700; margin-top:4px;}
  .stat.low .value{color:var(--danger);}
  table{width:100%; border-collapse:collapse; font-size:.9rem;}
  th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--border);}
  th{color:var(--muted); font-weight:600; font-size:.78rem; text-transform:uppercase; letter-spacing:.4px;}
  tr:hover td{background:rgba(255,255,255,0.02);}
  .pill{padding:2px 9px; border-radius:999px; font-size:.75rem; font-weight:600;}
  .pill.ok{background:rgba(76,175,125,.15); color:var(--ok);}
  .pill.warn{background:rgba(226,162,59,.15); color:var(--warn);}
  .pill.danger{background:rgba(226,87,76,.15); color:var(--danger);}
  label{display:block; font-size:.78rem; color:var(--muted); margin:10px 0 4px;}
  input,select,textarea{
    width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text); font-size:.9rem; font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:1px solid var(--accent);}
  button.btn{
    background:var(--accent); color:#17191f; border:none; padding:10px 18px;
    border-radius:8px; font-weight:600; cursor:pointer; font-size:.88rem; margin-top:14px;
  }
  button.btn:hover{background:var(--accent2); color:#fff;}
  button.btn.secondary{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
  button.btn.danger{background:var(--danger); color:#fff;}
  button.small{padding:5px 10px; font-size:.78rem; border-radius:6px; margin:0;}
  .line-row{
    display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:8px; align-items:end; margin-bottom:8px;
  }
  .muted{color:var(--muted); font-size:.85rem;}
  .hint{font-size:.78rem; color:var(--muted); margin-top:4px;}
  .toast{
    position:fixed; bottom:20px; right:20px; background:var(--panel2); border:1px solid var(--border);
    padding:12px 18px; border-radius:8px; color:var(--text); font-size:.88rem; z-index:999;
    box-shadow:0 4px 18px rgba(0,0,0,.4); display:none;
  }
  .toast.show{display:block;}
  .toast.ok{border-color:var(--ok);}
  .toast.err{border-color:var(--danger);}
  .empty{color:var(--muted); font-size:.85rem; padding:14px 0; text-align:center;}
  .flex{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .flex.between{justify-content:space-between;}
  .config-box{max-width:520px; margin:60px auto;}
  .subtle-link{color:var(--accent); cursor:pointer; font-size:.82rem; text-decoration:underline;}
  .tag-cat{color:var(--muted); font-size:.78rem;}

  /* ---- Printable report ---- */
  #reportTable{
    display:none; background:#fff; color:#111; padding:16px; border-radius:8px;
  }
  #reportTable table{font-size:.75rem;}
  #reportTable th, #reportTable td{border:1px solid #999; padding:4px 6px; color:#111;}
  #reportTable th{background:#f0f0f0;}
  #reportTable h2{color:#111; text-align:center; margin:0 0 4px;}
  #reportTable .sub{color:#555; text-align:center; font-size:.8rem; margin-bottom:12px;}
  .mark-cell{text-align:center; font-weight:600;}
  @media print{
    body *{visibility:hidden;}
    #reportTable, #reportTable *{visibility:visible;}
    #reportTable{display:block !important; position:absolute; top:0; left:0; width:100%; padding:0;}
    @page{size:landscape;}
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div id="configScreen" class="config-box card" style="display:none;">
  <h2>Connect to Supabase</h2>
  <p class="muted">Enter your Supabase project URL and anon public key (Project Settings → API). These are saved only in this browser.</p>
  <label>Supabase URL</label>
  <input id="cfgUrl" placeholder="https://xxxx.supabase.co" />
  <label>Anon public key</label>
  <input id="cfgKey" placeholder="eyJhbGciOi..." />
  <button class="btn" onclick="saveConfig()">Connect</button>
  <p class="hint">Run schema.sql in the Supabase SQL editor first if you haven't already.</p>
</div>

<div id="app" style="display:none;">
  <header>
    <h1>Magallanes <span>Casket Production &amp; Inventory</span></h1>
    <div class="flex">
      <span id="connStatus">connecting…</span>
      <span class="subtle-link" onclick="showConfig()">reconnect</span>
    </div>
  </header>
  <nav id="tabs">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="caskets">Caskets</button>
    <button data-tab="materialsused">Materials Used</button>
    <button data-tab="shipments">Log Shipment</button>
    <button data-tab="materials">Materials</button>
    <button data-tab="models">Casket Models</button>
    <button data-tab="branches">Branches</button>
    <button data-tab="staff">Staff</button>
    <button data-tab="history">History</button>
    <button data-tab="reports">Print Report</button>
  </nav>
  <main id="main"></main>
</div>

<div id="reportTable"></div>

<script>
// ---------------------------------------------------------------
// Config / connection
// ---------------------------------------------------------------
// Fill these in with your Supabase project's own URL and anon public key
// (Project Settings -> API) so the app connects automatically for everyone,
// on any device or browser, with no "Connect to Supabase" prompt.
const DEFAULT_SUPABASE_URL = "https://wfimsnbzopshshahdqke.supabase.co";
const DEFAULT_SUPABASE_KEY = "sb_publishable_ifzT3whOJV2cS5UnBf6mGQ_jB1tyI2x";

let sb = null;
let STAFF = [], MATERIALS = [], MODELS = [], STOCK = [], BRANCHES = [];

function toast(msg, kind){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + (kind||'');
  setTimeout(()=>t.classList.remove('show'), 3200);
}

function showConfig(){
  document.getElementById('configScreen').style.display='block';
  document.getElementById('app').style.display='none';
  const url = localStorage.getItem('sb_url')||''; const key = localStorage.getItem('sb_key')||'';
  document.getElementById('cfgUrl').value = url;
  document.getElementById('cfgKey').value = key;
}

function saveConfig(){
  const url = document.getElementById('cfgUrl').value.trim();
  const key = document.getElementById('cfgKey').value.trim();
  if(!url || !key){ toast('Enter both fields', 'err'); return; }
  localStorage.setItem('sb_url', url);
  localStorage.setItem('sb_key', key);
  init();
}

async function init(){
  const url = localStorage.getItem('sb_url') || DEFAULT_SUPABASE_URL;
  const key = localStorage.getItem('sb_key') || DEFAULT_SUPABASE_KEY;
  if(!url || !key){ showConfig(); return; }
  sb = window.supabase.createClient(url, key);
  document.getElementById('configScreen').style.display='none';
  document.getElementById('app').style.display='block';
  const status = document.getElementById('connStatus');
  try{
    const { error } = await sb.from('materials').select('id').limit(1);
    if(error) throw error;
    status.textContent = 'connected'; status.className='ok';
  }catch(e){
    status.textContent = 'connection error: ' + e.message; status.className='bad';
    toast('Could not reach Supabase. Check URL/key and that schema.sql has been run.', 'err');
    return;
  }
  await loadAll();
  render('dashboard');
}

async function loadAll(){
  const [s, m, mo, st, br] = await Promise.all([
    sb.from('staff').select('*').eq('active', true).order('name'),
    sb.from('materials').select('*').eq('active', true).order('name'),
    sb.from('casket_models').select('*').eq('active', true).order('name'),
    sb.from('material_stock').select('*').order('name'),
    sb.from('branches').select('*').eq('active', true).order('name'),
  ]);
  STAFF = s.data || [];
  MATERIALS = m.data || [];
  MODELS = mo.data || [];
  STOCK = st.data || [];
  BRANCHES = br.data || [];
}

// ---------------------------------------------------------------
// Nav
// ---------------------------------------------------------------
document.getElementById('tabs').addEventListener('click', (e)=>{
  if(e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  render(e.target.dataset.tab);
});

async function render(tab){
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">Loading…</div>';
  await loadAll();
  if(tab==='dashboard') return renderDashboard();
  if(tab==='caskets') return renderCaskets();
  if(tab==='materialsused') return renderMaterialsUsed();
  if(tab==='shipments') return renderShipments();
  if(tab==='materials') return renderMaterials();
  if(tab==='models') return renderModels();
  if(tab==='branches') return renderBranches();
  if(tab==='staff') return renderStaff();
  if(tab==='history') return renderHistory();
  if(tab==='reports') return renderReports();
}

function fmt(n){ return Number(n).toLocaleString(undefined,{maximumFractionDigits:2}); }

// ---------------------------------------------------------------
// Dashboard
// ---------------------------------------------------------------
async function renderDashboard(){
  const main = document.getElementById('main');
  const lowStock = STOCK.filter(s => s.reorder_threshold && Number(s.current_stock) <= Number(s.reorder_threshold));

  const { data: units } = await sb.from('casket_units').select('status, produced_at, started_at');
  const all = units || [];
  const totalMade = all.filter(u => u.status !== 'in_progress').length;
  const last30 = all.filter(u => u.produced_at && (Date.now() - new Date(u.produced_at).getTime()) < 30*86400000).length;
  const openCount = all.filter(u => u.status === 'in_progress').length;
  const inStockCount = all.filter(u => u.status === 'completed').length;

  main.innerHTML = `
    <div class="grid cols-4">
      <div class="stat"><div class="label">Materials tracked</div><div class="value">${MATERIALS.length}</div></div>
      <div class="stat ${lowStock.length?'low':''}"><div class="label">Low stock alerts</div><div class="value">${lowStock.length}</div></div>
      <div class="stat"><div class="label">Total caskets completed</div><div class="value">${fmt(totalMade)}</div></div>
      <div class="stat"><div class="label">Completed (last 30 days)</div><div class="value">${fmt(last30)}</div></div>
      <div class="stat"><div class="label">In progress</div><div class="value">${openCount}</div></div>
      <div class="stat"><div class="label">Completed, not yet assigned</div><div class="value">${inStockCount}</div></div>
    </div>

    ${lowStock.length ? `
    <div class="card">
      <h2>⚠ Low Stock</h2>
      <table><thead><tr><th>Material</th><th>Current</th><th>Reorder at</th></tr></thead>
      <tbody>${lowStock.map(s=>`<tr><td>${s.name}</td><td>${fmt(s.current_stock)} ${s.unit}</td><td>${fmt(s.reorder_threshold)} ${s.unit}</td></tr>`).join('')}</tbody>
      </table>
    </div>` : ''}

    <div class="card">
      <h2>Current Stock</h2>
      <table>
        <thead><tr><th>Material</th><th>Category</th><th>Stock</th><th>Status</th></tr></thead>
        <tbody>
        ${STOCK.length ? STOCK.map(s=>{
          let pill = 'ok', label='OK';
          if(s.reorder_threshold){
            if(Number(s.current_stock) <= 0){ pill='danger'; label='OUT'; }
            else if(Number(s.current_stock) <= Number(s.reorder_threshold)){ pill='warn'; label='LOW'; }
          }
          return `<tr><td>${s.name}</td><td class="tag-cat">${s.category||'—'}</td><td>${fmt(s.current_stock)} ${s.unit}</td><td><span class="pill ${pill}">${label}</span></td></tr>`;
        }).join('') : '<tr><td colspan="4" class="empty">No materials yet — add some in the Materials tab.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

// ---------------------------------------------------------------
// Caskets — each one tracked by serial number through its whole life:
//   in_progress -> completed -> assigned (to a deceased/case) -> shipped (to a branch)
// Material usage is logged separately in the Materials Used tab, not here —
// this tab just tracks the casket's own progress.
// ---------------------------------------------------------------
let openCaskets = [];
const STATUS_LABEL = { in_progress:'In Progress', completed:'Completed', assigned:'Assigned', shipped:'Shipped' };
const STATUS_PILL = { in_progress:'warn', completed:'ok', assigned:'ok', shipped:'ok' };

async function renderCaskets(){
  const main = document.getElementById('main');
  const { data } = await sb.from('casket_units')
    .select('*, casket_models(name), maker:produced_by(name), branches(name)')
    .neq('status', 'shipped').order('started_at', {ascending:false});
  openCaskets = data || [];

  main.innerHTML = `
    <div class="card">
      <h2>Start a New Casket</h2>
      <p class="muted">Give it a serial number as soon as work begins. Materials used while building it are logged separately in the Materials Used tab — just reference this same serial number there. Once it's done, mark it Completed below.</p>
      <div class="grid cols-4">
        <div><label>Serial No.</label><input id="nbSerial" placeholder="e.g. C-092726-7"/></div>
        <div><label>Casket Model (optional)</label>
          <select id="nbModel"><option value="">— unspecified —</option>${MODELS.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select>
        </div>
        <div><label>Maker</label>
          <select id="nbStaff">${STAFF.map(s=>`<option value="${s.id}">${s.name}</option>`).join('') || '<option disabled>Add staff first</option>'}</select>
        </div>
        <div><label>Date</label><input id="nbDate" type="datetime-local" value="${new Date().toISOString().slice(0,16)}"/></div>
      </div>
      <label>Notes</label>
      <textarea id="nbNotes" rows="2" placeholder="optional"></textarea>
      <button class="btn" onclick="startCasket()">Start Casket</button>
    </div>

    <div class="card">
      <h2>Active Caskets (not yet shipped)</h2>
      ${openCaskets.length ? `
      <table>
        <thead><tr><th>Serial No.</th><th>Status</th><th>Model</th><th>Maker</th><th>Started</th><th>For</th><th></th></tr></thead>
        <tbody>
        ${openCaskets.map(b=>`
          <tr>
            <td><strong>${b.serial_no}</strong></td>
            <td><span class="pill ${STATUS_PILL[b.status]}">${STATUS_LABEL[b.status]}</span></td>
            <td>${b.casket_models?.name || '—'}</td>
            <td>${b.maker?.name||'—'}</td>
            <td>${new Date(b.started_at).toLocaleDateString()}</td>
            <td class="muted">${b.deceased_name ? `${b.deceased_name}${b.deceased_address?' — '+b.deceased_address:''}` : '—'}</td>
            <td>
              ${b.status==='in_progress' ? `<button class="btn small" onclick="markCompleted('${b.id}')">Mark Completed</button>` : ''}
              ${b.status==='completed' ? `<button class="btn small" onclick="openAssign('${b.id}')">Assign to Case</button>` : ''}
              ${b.status==='assigned' ? `<button class="btn small" onclick="openShip('${b.id}')">Ship to Branch</button>` : ''}
            </td>
          </tr>
        `).join('')}
        </tbody>
      </table>
      ` : '<p class="empty">No active caskets. Start one above.</p>'}
    </div>
  `;
}

async function startCasket(){
  const serial_no = document.getElementById('nbSerial').value.trim();
  const model = document.getElementById('nbModel').value || null;
  const staff = document.getElementById('nbStaff').value;
  const date = document.getElementById('nbDate').value;
  const notes = document.getElementById('nbNotes').value;
  if(!serial_no){ toast('Enter a serial number', 'err'); return; }
  if(!staff){ toast('Pick the maker', 'err'); return; }

  const { error } = await sb.from('casket_units').insert({
    serial_no, casket_model_id: model, produced_by: staff, status: 'in_progress',
    started_at: new Date(date).toISOString(), notes
  });
  if(error){
    if(error.message && error.message.includes('duplicate')) toast('That serial number is already in use', 'err');
    else toast('Error: '+error.message, 'err');
    return;
  }
  toast('Casket started', 'ok');
  render('caskets');
}

async function markCompleted(unitId){
  const { error } = await sb.from('casket_units').update({
    status: 'completed', produced_at: new Date().toISOString()
  }).eq('id', unitId);
  if(error){ toast('Error: '+error.message, 'err'); return; }
  toast('Casket marked completed', 'ok');
  render('caskets');
}

function openAssign(unitId){
  const name = prompt('Name of deceased this casket is for:');
  if(name === null) return;
  const address = prompt('Address:') || '';
  if(!name.trim()){ toast('Name is required', 'err'); return; }
  assignCasket(unitId, name.trim(), address.trim());
}
async function assignCasket(unitId, name, address){
  const { error } = await sb.from('casket_units').update({
    status: 'assigned', deceased_name: name, deceased_address: address, assigned_at: new Date().toISOString()
  }).eq('id', unitId);
  if(error){ toast('Error: '+error.message, 'err'); return; }
  toast('Casket assigned', 'ok');
  render('caskets');
}

function openShip(unitId){
  if(!BRANCHES.length){ toast('Add a branch first (Branches tab)', 'err'); return; }
  const list = BRANCHES.map((b,i)=>`${i+1}. ${b.name}`).join('\n');
  const choice = prompt('Ship to which branch?\n'+list+'\n\nEnter the number:');
  if(choice === null) return;
  const branch = BRANCHES[Number(choice)-1];
  if(!branch){ toast('Invalid choice', 'err'); return; }
  const dateStr = prompt('Dispatch date (YYYY-MM-DD):', new Date().toISOString().slice(0,10));
  if(dateStr === null) return;
  const crate = prompt('Crate label (optional):', '') || '';
  shipCasket(unitId, branch.id, dateStr, crate);
}
async function shipCasket(unitId, branchId, dateStr, crate){
  const { error } = await sb.from('casket_units').update({
    status: 'shipped', branch_id: branchId, dispatch_date: dateStr, crate_label: crate
  }).eq('id', unitId);
  if(error){ toast('Error: '+error.message, 'err'); return; }
  toast('Casket marked shipped', 'ok');
  render('caskets');
}

// ---------------------------------------------------------------
// Materials Used — standalone daily log. Anyone pulling materials from
// inventory logs it here directly, optionally noting which casket serial
// number it's for (free text — doesn't require that casket to exist yet).
// This is what actually deducts from current stock.
// ---------------------------------------------------------------
async function renderMaterialsUsed(){
  const main = document.getElementById('main');
  const { data } = await sb.from('casket_materials_used')
    .select('*, materials(name, unit), staff(name)')
    .order('created_at', {ascending:false}).limit(100);
  const log = data || [];

  main.innerHTML = `
    <div class="card">
      <h2>Log Materials Used</h2>
      <p class="muted">Record materials pulled from inventory on any given day. This is what updates the stock counts on the Dashboard.</p>
      <div class="grid cols-4">
        <div><label>Date</label><input id="muDate" type="datetime-local" value="${new Date().toISOString().slice(0,16)}"/></div>
        <div><label>Material</label>
          <select id="muMaterial">${MATERIALS.map(m=>`<option value="${m.id}">${m.name} (${m.unit})</option>`).join('') || '<option disabled>Add a material first</option>'}</select>
        </div>
        <div><label>Quantity Used</label><input id="muQty" type="number" min="0" step="any"/></div>
        <div><label>Used By</label>
          <select id="muStaff"><option value="">— select —</option>${STAFF.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select>
        </div>
      </div>
      <label>Casket Serial No. (optional)</label>
      <input id="muSerial" placeholder="e.g. C-092726-7 — leave blank if not for a specific casket"/>
      <button class="btn" onclick="submitStandaloneUsage()">Save</button>
    </div>

    <div class="card">
      <h2>Recent Materials Used</h2>
      <table>
        <thead><tr><th>Date</th><th>Material</th><th>Qty</th><th>Used By</th><th>Casket Serial</th></tr></thead>
        <tbody>
        ${log.length ? log.map(u=>`
          <tr>
            <td>${new Date(u.created_at).toLocaleString()}</td>
            <td>${u.materials?.name||'?'}</td>
            <td>${fmt(u.quantity_used)}</td>
            <td>${u.staff?.name||'—'}</td>
            <td class="muted">${u.serial_no||'—'}</td>
          </tr>
        `).join('') : '<tr><td colspan="5" class="empty">No materials logged yet</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

async function submitStandaloneUsage(){
  const date = document.getElementById('muDate').value;
  const material_id = document.getElementById('muMaterial').value;
  const qty = Number(document.getElementById('muQty').value);
  const used_by = document.getElementById('muStaff').value || null;
  const serial_no = document.getElementById('muSerial').value.trim() || null;

  if(!material_id){ toast('Pick a material', 'err'); return; }

async function submitShipment(){

  const { error } = await sb.from('material_shipments').insert({

    received_at: new Date(date).toISOString(), notes
  });

// Materials management
// ---------------------------------------------------------------
function renderMaterials(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card">
      <h2>Add Material</h2>
      <p class="muted">Materials are counted in pieces (PCS). To add stock for a material that already exists, use the Log Shipment tab instead — it adds onto the existing total rather than creating a second entry.</p>
      <div class="grid cols-3">
        <div><label>Name</label><input id="mName" placeholder="e.g. Mahogany plywood"/></div>
        <div><label>Category</label><input id="mCategory" placeholder="e.g. Wood"/></div>
        <div><label>Reorder threshold</label><input id="mThreshold" type="number" min="0" step="any"/></div>
      </div>
      <button class="btn" onclick="submitMaterial()">Add Material</button>
    </div>
    <div class="card">
      <h2>All Materials</h2>
      <table>
        <thead><tr><th>Name</th><th>Category</th><th>Reorder at</th><th></th></tr></thead>
        <tbody>
        ${MATERIALS.length ? MATERIALS.map(m=>`
          <tr><td>${m.name}</td><td class="tag-cat">${m.category||'—'}</td><td>${m.reorder_threshold?fmt(m.reorder_threshold):'—'}</td>
          <td class="flex">
            <button class="btn secondary small" onclick="editMaterial('${m.id}')">Edit</button>
            <button class="btn secondary small" onclick="deleteMaterial('${m.id}')">Delete</button>
            <button class="btn secondary small" onclick="archiveMaterial('${m.id}')">Archive</button>
          </td></tr>
        `).join('') : '<tr><td colspan="4" class="empty">No materials yet</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}
async function submitMaterial(){
  const name = document.getElementById('mName').value.trim();
  const category = document.getElementById('mCategory').value.trim();
  const reorder_threshold = document.getElementById('mThreshold').value || 0;
  if(!name){ toast('Name is required', 'err'); return; }
  const dup = MATERIALS.find(m => m.name.toLowerCase() === name.toLowerCase());
  if(dup){ toast(`"${dup.name}" already exists — use Log Shipment to add stock to it instead`, 'err'); return; }
  const { error } = await sb.from('materials').insert({ name, category, unit: 'PCS', reorder_threshold });
  if(error){ toast('Error: '+error.message, 'err'); return; }
  toast('Material added', 'ok');
  render('materials');
}
function editMaterial(id){
  const m = MATERIALS.find(x=>x.id===id);
  if(!m) return;
  const name = prompt('Name:', m.name);
  if(name === null) return;
  if(!name.trim()){ toast('Name is required', 'err'); return; }
  const category = prompt('Category:', m.category||'');
  if(category === null) return;
  const threshold = prompt('Reorder threshold:', m.reorder_threshold||0);
  if(threshold === null) return;
  updateMaterial(id, name.trim(), category.trim(), Number(threshold)||0);
}
async function updateMaterial(id, name, category, reorder_threshold){
  const dup = MATERIALS.find(m => m.id!==id && m.name.toLowerCase()===name.toLowerCase());
  if(dup){ toast(`"${dup.name}" already exists under that name`, 'err'); return; }
  const { error } = await sb.from('materials').update({ name, category, reorder_threshold }).eq('id', id);
  if(error){ toast('Error: '+error.message, 'err'); return; }
  toast('Material updated', 'ok');
  render('materials');
}
async function deleteMaterial(id){
  const m = MATERIALS.find(x=>x.id===id);
  if(!confirm(`Permanently delete "${m?.name}"? This only works if it has no shipments or usage logged against it yet — otherwise use Archive instead.`)) return;
  const { error } = await sb.from('materials').delete().eq('id', id);
  if(error){
    toast('Can\'t delete — this material already has shipments or usage logged against it. Use Archive instead to hide it while keeping its history.', 'err');
    return;
  }
  toast('Material deleted', 'ok');
  render('materials');
}
async function archiveMaterial(id){
  if(!confirm('Archive this material? It will be hidden but history is kept.')) return;
  await sb.from('materials').update({active:false}).eq('id', id);
  render('materials');
}

// ---------------------------------------------------------------
// Printable Report — mirrors the paper "Inventory of Produced Casket"
// sheet: one column per maker (date they built it), one column per
// branch (dispatch date, color-coded), deceased name + address.
// ---------------------------------------------------------------
const REPORT_COLORS = ['#e6d9f2','#f2e2c4','#d2e9f7','#d7f0da','#f7d9d9','#f9e8c2','#dde7f9'];

function monthStartEnd(){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  const end = new Date(now.getFullYear(), now.getMonth()+1, 0);
  return [start.toISOString().slice(0,10), end.toISOString().slice(0,10)];
}

function renderReports(){
  const main = document.getElementById('main');
  const [defFrom, defTo] = monthStartEnd();
  main.innerHTML = `
    <div class="card">
      <h2>Print Report</h2>
      <p class="muted">Builds a printable sheet shaped like the paper inventory log — a column per maker, a column per branch, with the deceased's name and address. Pick a date range (based on when each casket was started) and generate.</p>
      <div class="grid cols-3">
        <div><label>From</label><input id="repFrom" type="date" value="${defFrom}"/></div>
        <div><label>To</label><input id="repTo" type="date" value="${defTo}"/></div>
        <div style="display:flex; align-items:end; gap:8px;">
          <button class="btn" onclick="generateReport()">Generate</button>
          <button class="btn secondary" id="printBtn" style="display:none;" onclick="window.print()">Print / Save PDF</button>
        </div>
      </div>
    </div>
    <div id="reportPreviewWrap"></div>
  `;
}

async function generateReport(){
  const from = document.getElementById('repFrom').value;
  const to = document.getElementById('repTo').value;
  if(!from || !to){ toast('Pick both dates', 'err'); return; }

  const { data: units, error } = await sb.from('casket_units')
    .select('*, maker:produced_by(name), branches(name)')
    .gte('started_at', from)
    .lte('started_at', to + 'T23:59:59')
    .order('serial_no');
  if(error){ toast('Error: '+error.message, 'err'); return; }

  const rows = units || [];
  const makers = STAFF.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const totalCols = 1 + makers.length + 2 + 1 + BRANCHES.length + 1; // Serial + makers + Deceased/Address + Date + branches + Crate
  const monthLabel = new Date(from + 'T00:00:00').toLocaleDateString(undefined, {month:'long', year:'numeric'});

  const html = `
    <h2>Inventory of Produced Casket</h2>
    <table style="width:100%; border-collapse:collapse;">
      <thead>
        <tr>
          <th style="text-align:left;">Date:</th>
          <th colspan="${makers.length}" style="text-align:left;">Month of ${monthLabel}</th>
          <th></th>
          <th></th>
          <th></th>
          <th colspan="${BRANCHES.length}" style="background:#f5e642;">Branches</th>
          <th></th>
        </tr>
        <tr>
          <th>Serial No.</th>
          ${makers.map(m=>`<th>${m.name}</th>`).join('')}
          <th>Name of Deceased</th>
          <th>Address</th>
          <th>Date</th>
          ${BRANCHES.map(b=>`<th>${b.name}</th>`).join('')}
          <th>Crate</th>
        </tr>
      </thead>
      <tbody>
        ${rows.length ? rows.map(r=>`
          <tr>
            <td>${r.serial_no}</td>
            ${makers.map(m=>`<td class="mark-cell">${r.produced_by===m.id ? new Date(r.started_at).toLocaleDateString() : ''}</td>`).join('')}
            <td>${r.deceased_name||''}</td>
            <td>${r.deceased_address||''}</td>
            <td class="mark-cell">${r.produced_at ? new Date(r.produced_at).toLocaleDateString() : ''}</td>
            ${BRANCHES.map(b=>`<td class="mark-cell">${r.branch_id===b.id && r.dispatch_date ? new Date(r.dispatch_date).toLocaleDateString() : ''}</td>`).join('')}
            <td>${r.crate_label||''}</td>
          </tr>
        `).join('') : `<tr><td colspan="${totalCols}" style="text-align:center; padding:14px;">No caskets started in this date range</td></tr>`}
      </tbody>
    </table>
  `;

  document.getElementById('reportTable').innerHTML = html;
  document.getElementById('reportPreviewWrap').innerHTML = `
    <div class="card" style="background:#fff;">
      <div style="color:#111;">${html}</div>
    </div>
  `;
  document.getElementById('printBtn').style.display = 'inline-block';
  toast('Report generated — scroll down to preview, or click Print', 'ok');
}

init();
</script>
